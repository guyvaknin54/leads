<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>רשימת המתנה</title>
</head>
<body>

    <!-- טופס ההרשמה שלך (ודא שה-ID תואמים למה שיש לך בעיצוב) -->
    <form id="waitlistForm">
        <input type="text" id="name" placeholder="שם מלא" required>
        <input type="email" id="email" placeholder="אימייל" required>
        <button type="submit">הצטרפות</button>
    </form>
    
    <div id="statusMessage" style="display:none;"></div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
      // כאן פונקציות המחשבון והלידים שלך (calc, randomLead וכדומה)...

      const form = document.getElementById("waitlistForm");
      const statusMessage = document.getElementById("statusMessage");

      form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const n = document.getElementById("name").value.trim();
        const mail = document.getElementById("email").value.trim();

        if (!n || !mail) {
          statusMessage.style.display = 'block';
          statusMessage.textContent = 'נא למלא שם מלא וכתובת דוא״ל.';
          return;
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbxhL0dbGVYJSyVqjXqZXOudNk0X-N9bip9eURGho7Ty56uKvWp_sVyXxq2XNxPOGkDL/exec";

        try {
          // שליחה בפורמט שעוקף שגיאות אבטחה ו-CORS בדפדפן
          const formData = new URLSearchParams();
          formData.append("name", n);
          formData.append("email", mail);

          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
          });

          const data = await res.json();
          statusMessage.style.display = 'block';

          if (data.success && data.alreadyRegistered) {
            statusMessage.textContent = 'כתובת הדוא״ל כבר רשומה.';
          } else if (data.success) {
            statusMessage.textContent = '✓ תודה! ההרשמה נקלטה בהצלחה.';
            form.reset();
          } else {
            statusMessage.textContent = 'שגיאה: לא ניתן לשמור את ההרשמה.';
          }

        } catch (err) {
          statusMessage.style.display = 'block';
          statusMessage.textContent = 'שגיאה בחיבור לשרת.';
        }
      });
    });
    </script>
</body>
</html>
