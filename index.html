<div class="card">
    <h3>הצטרפות לרשימת ההמתנה</h3>

    <form id="waitlistForm">
        <input id="name" placeholder="שם מלא">
        <input id="email" placeholder="כתובת דוא״ל">
        <button class="btn" type="submit">הצטרפות לרשימת ההמתנה</button>
    </form>

    <div id="statusMessage"></div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhL0dbGVYJSyVqjXqZXOudNk0X-N9bip9eURGho7Ty56uKvWp_sVyXxq2XNxPOGkDL/exec';

document.getElementById('waitlistForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
    })
    .then(() => {
        if (typeof gtag === 'function') {
            gtag('event', 'sign_up_waitlist', {
                event_category: 'engagement',
                event_label: 'Waitlist Form'
            });
        }

        document.getElementById('statusMessage').innerText = 'תודה! נרשמת בהצלחה.';
        document.getElementById('waitlistForm').reset();
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('statusMessage').innerText = 'ארעה שגיאה, נסה שנית.';
    });
});
</script>
